name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: desktop/requirements/*.txt
      - name: Install CPU test dependencies
        run: |
          python -m pip install torch==2.14.1 torchvision==0.29.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r desktop/requirements/requirements.txt -r desktop/requirements/requirements-server.txt -r desktop/requirements/requirements-dev.txt
      - name: Static checks
        run: ruff check desktop scripts training
      - name: Backend regression tests (no models or private catalog)
        working-directory: desktop
        run: python -B -m unittest discover -s tests
      - name: Training utilities
        run: python -B -m unittest discover -s training/collector_numbers -p 'test_*.py'
      - name: Validate shell entry points
        run: bash -n setup.sh start-server.sh mobile/build.sh mobile/test.sh training/collector_numbers/train.sh
      - name: Validate public source bundle
        run: python scripts/package_source.py --output dist/pokemon-tcg-scanner-source.zip
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile and run unit tests
        working-directory: mobile/android
        run: bash gradlew testDebugUnitTest assembleDebug
      # Compile-only APK is deliberately not published: it lacks locally prepared model weights.
