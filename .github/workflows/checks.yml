name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-14, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: desktop/requirements/*.txt
      - uses: actions/cache@v4
        with:
          path: .git/lfs/objects
          key: collector-${{ hashFiles('models/collector-number/rfdetr-small.json') }}
      - name: Fetch collector checkpoint
        run: |
          git lfs install --local
          git lfs pull --include="models/collector-number/rfdetr-small.pth"
      - name: Install full CPU pipeline
        run: |
          python scanner.py setup --device cpu
          python scanner.py pip install -r desktop/requirements/requirements-dev.txt
      - name: Static checks
        run: python scanner.py python -m ruff check desktop scripts training scanner.py mobile/build.py
      - name: Backend regression tests (no models or private catalog)
        run: python scanner.py python -m unittest discover -s desktop/tests
      - name: Training utilities
        run: python scanner.py python -m unittest discover -s training/collector_numbers -p 'test_*.py'
      - name: Real collector and recognition workers
        run: python scanner.py python desktop/tools/check_model_workers.py --download
      - name: Validate shell entry points
        if: runner.os == 'Linux'
        run: bash -n setup.sh start-server.sh mobile/build.sh mobile/test.sh training/collector_numbers/train.sh
      - name: Validate public source bundle
        run: python scripts/package_source.py --output dist/pokemon-tcg-scanner-source.zip
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile and run unit tests
        working-directory: mobile/android
        run: bash gradlew testDebugUnitTest assembleDebug
      # Compile-only APK is deliberately not published: it lacks locally prepared model weights.
