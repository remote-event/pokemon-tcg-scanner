name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - '.github/workflows/android-apk.yml'
      - 'mobile/android/**'
      - 'desktop/tools/export_phone_detector.py'
      - 'desktop/tcg_scanner/detection.py'
      - 'desktop/requirements/requirements-*export.txt'
      - 'desktop/requirements/requirements-yolo.txt'
      - 'scripts/prepare_android_model.py'
      - 'scripts/package_source.py'
      - 'scripts/package_android_distribution.py'

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Set release version
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo '::error::Release tags must use vMAJOR.MINOR.PATCH, for example v1.1.5.'
            exit 1
          fi
          echo "APK_VERSION_NAME=${RELEASE_TAG#v}" >> "$GITHUB_ENV"
      - name: Check signing configuration
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ] || [ -z "$PASSWORD" ]; then
            echo '::error::Configure ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD; see docs/RELEASING.md.'
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: desktop/requirements/*.txt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare the on-device detector
        run: |
          python -m pip install torch==2.14.1 torchvision==0.29.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r desktop/requirements/requirements-android-export.txt
          python scripts/prepare_android_model.py --source-output dist/source-model/card_pose_yolov8n.pt
      - name: Build and test
        env:
          APK_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          bash mobile/android/gradlew -p mobile/android testDebugUnitTest assembleRelease
      - name: Sign and verify APK
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          umask 077
          keyfile="$RUNNER_TEMP/scanner-release.p12"
          trap 'rm -f "$keyfile"' EXIT
          printf '%s' "$KEYSTORE" | base64 --decode > "$keyfile"
          build_tools="$ANDROID_HOME/build-tools/36.0.0"
          "$build_tools/zipalign" -P 16 -f 4 mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$build_tools/apksigner" sign --ks "$keyfile" --ks-key-alias scanner --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEYSTORE_PASSWORD --out dist/pokemon-tcg-scanner.apk "$RUNNER_TEMP/aligned.apk"
          "$build_tools/apksigner" verify --verbose --print-certs dist/pokemon-tcg-scanner.apk > dist/signing-certificate.txt
          "$build_tools/zipalign" -c -P 16 4 dist/pokemon-tcg-scanner.apk
      - name: Verify packaged model and include source
        env:
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}/tree/${{ github.sha }}
        run: |
          python scripts/package_source.py --output dist/pokemon-tcg-scanner-source.zip
          python scripts/package_android_distribution.py
      - uses: actions/upload-artifact@v4
        id: download
        with:
          name: pokemon-tcg-scanner-android-${{ github.run_number }}
          path: dist/release/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
      - name: Download link
        env:
          ARTIFACT_URL: ${{ steps.download.outputs.artifact-url }}
        run: |
          echo "[Download the signed APK and source bundle]($ARTIFACT_URL)" >> "$GITHUB_STEP_SUMMARY"

  release:
    needs: apk
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pokemon-tcg-scanner-android-${{ github.run_number }}
          path: dist
      - name: Verify downloads
        working-directory: dist
        run: sha256sum --check SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          Download **pokemon-tcg-scanner.apk** below and open it on an Android 8.0+ phone. The card detector is included; no Android build tools or GitHub sign-in are needed.

          The app connects to a local computer running the scanner server. Follow the [setup guide]($REPOSITORY_URL/tree/$RELEASE_TAG#quick-start) for Windows, Linux, or macOS.

          Updates use the same release signing key. A locally built debug app has a different signature and cannot be updated in place with this APK; see [installation details]($REPOSITORY_URL/blob/$RELEASE_TAG/mobile/README.md#install-the-github-build).

          **pokemon-tcg-scanner-sources.zip** contains matching app source, the original phone model, and license notices. **SHA256SUMS** verifies the downloads; **signing-certificate.txt** records the public signing fingerprint. For the server model and training dataset, clone the repository with Git LFS as described in the setup guide.
          EOF
          gh release create "$RELEASE_TAG" dist/* --verify-tag --draft --title "pokemon-tcg-scanner $RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
          gh release edit "$RELEASE_TAG" --draft=false --latest
          echo "[Download the release]($REPOSITORY_URL/releases/tag/$RELEASE_TAG)" >> "$GITHUB_STEP_SUMMARY"
